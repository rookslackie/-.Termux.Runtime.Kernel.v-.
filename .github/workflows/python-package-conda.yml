name: Python verification

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-ci.lock
    - name: Install locked runtime and verification dependencies
      run: |
        python -m pip install -r requirements.txt -r requirements-ci.lock
        python -m pip check
    - name: Check Python syntax and undefined names
      run: python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Test capsule engine, Xi World, glyph runtime, and QuantumCompute stack
      run: python -m pytest -v
    - name: Verify PQ backend, FullCycle transfer, and checkpoint replay
      env:
        XI_QUANTUM_TEST_HOME: ${{ runner.temp }}/xi-quantumcompute-home
        XI_QUANTUM_RESULTS: ${{ runner.temp }}/xi-quantumcompute-results
      run: |
        mkdir -p "$XI_QUANTUM_RESULTS"
        python -m xi_quantum doctor > "$XI_QUANTUM_RESULTS/doctor.json"
        python -m xi_quantum --home "$XI_QUANTUM_TEST_HOME" fullcycle Ξ.QuantumCompute.yaml \
          --output "$XI_QUANTUM_RESULTS/fullcycle.json"
        python - <<'PY'
        import json
        import os
        from pathlib import Path
        from xi_quantum.__main__ import fullcycle_demo
        from xi_quantum.common import PROFILES

        folder = Path(os.environ['XI_QUANTUM_RESULTS'])
        first = json.loads((folder / 'fullcycle.json').read_text())
        replay = fullcycle_demo(Path('Ξ.QuantumCompute.yaml').read_bytes(), PROFILES['mobile'],
                                os.environ['XI_QUANTUM_TEST_HOME'])
        assert first['exact_source_roundtrip'] and first['duplicate_packet_is_idempotent']
        assert first['receiver']['restored_from_peer_this_call'] == 2
        assert first['receiver']['executed_this_call'] == 3
        assert replay['sender']['executed_this_call'] == replay['receiver']['executed_this_call'] == 0
        assert first['receiver']['integrity'] == replay['receiver']['integrity']
        print('Encrypted FullCycle transfer, persistent resume and exact replay verified.')
        PY
    - uses: actions/upload-artifact@v4
      with:
        name: xi-quantumcompute-fullcycle
        path: ${{ runner.temp }}/xi-quantumcompute-results/
        if-no-files-found: error
    - name: Benchmark independent Z noise and verify persistent replay
      env:
        XI_NOISE_DIR: ${{ runner.temp }}/xi-noise-benchmark
      run: |
        python -m xi_field.noise_benchmark --p 0 0.1 0.5 0.9 1 --shots 1024 --seed 20261018 \
          --ledger-trials 2 --db "$XI_NOISE_DIR/ledger.sqlite3" --output "$XI_NOISE_DIR/results.json"
        python - <<'PY'
        import json
        import os
        from pathlib import Path
        from xi_field.noise_benchmark import run

        folder = Path(os.environ['XI_NOISE_DIR'])
        first = json.loads((folder / 'results.json').read_text())
        replay = run(probabilities=(0, 0.1, 0.5, 0.9, 1), shots=1024, seed=20261018,
                     database=folder / 'ledger.sqlite3', ledger_trials=2)
        assert first['run_id'] == replay['run_id']
        assert first['persistence']['traces'] == replay['persistence']['traces']
        for a, b in zip(first['points'], replay['points']):
            for key in ('encoded', 'unencoded', 'mask_counts', 'fault_weight_counts'):
                assert a[key] == b[key], (a['p'], key)
        print('Benchmark outcomes and SQLite head hashes reproduce exactly.')
        PY
    - uses: actions/upload-artifact@v4
      with:
        name: xi-independent-z-benchmark
        path: ${{ runner.temp }}/xi-noise-benchmark/
        if-no-files-found: error
    - name: Smoke test the local HTTP interface
      env:
        FORGECORE_DIR: ${{ runner.temp }}/xi-world-smoke
        XI_FIELD_DB: ${{ runner.temp }}/xi-world-smoke/field.sqlite3
      run: |
        python - <<'PY'
        from fastapi.testclient import TestClient
        from server import app

        with TestClient(app) as client:
            for path in ('/health', '/api/capsules', '/api/quantum-field', '/api/quantumcompute', '/api/quantumcompute/example'):
                response = client.get(path)
                assert response.status_code == 200, (path, response.text)
            assert client.get('/health').json()['ok'] is True
        PY
