services:
  sanctuary:
    build:
      context: .
      dockerfile: Dockerfile.base44
    # The cloned source is bind-mounted over /app and served by uvicorn --reload,
    # so edits appear in the preview without rebuilding the image.
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - FORGECORE_DIR=/app
      - XI_NODE_ID=forgecore-primary
      - XI_NODE_NAME=ForgeCore.Primary
      - PORT=3000
      - PYTHONUNBUFFERED=1
    command:
      - python
      - -m
      - uvicorn
      - server:app
      - --host=0.0.0.0
      - --port=3000
      - --reload
      - --reload-dir=/app
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; r=urllib.request.urlopen('http://localhost:3000/health',timeout=5); d=json.loads(r.read()); exit(0 if d.get('ok') else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      base44.project: "The Sanctuary"
      base44.kind: "web"
      base44.port: "3000"
